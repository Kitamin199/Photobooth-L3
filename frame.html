<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame Photobooth</title>
  <link rel="stylesheet" href="style.css">

</head>
<body class="frame-page">
<nav class="frame-page">
        <div class="wrapper">
            <div class="logo">
                <a href="#">Photobooth</a>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="#galeri">Galeri</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="judulhalframe">Pilih Frame yang Kamu Mau!</h1>

    <div class="right-panel">
      <div class="grid-frames">

        <!--FRAME 2!--> 
        <div class="card-frame">
          <div>
            <div class="frame-mockup">
              <div class="mini-photostrip">
                <div class="mini-photo"></div>
                <div class="mini-photo"></div>
                <div class="mini-photo"></div>
              </div>
            </div>
            <div class="frame-title">2 Frame</div>
          </div>
          <div>
            <a href=foto.html class="btn-primary" onclick="pilihFrame('Série 01: Pure Oat', '#f1ede4', 'count-1')">Pilih</a>
          </div>
        </div>

        <!--FRAME 4!-->
        <div class="card-frame">
          <div>
            <div class="frame-mockup" style="background-color: #e8e2d5;">
              <div class="mini-photostrip" style="background-color: #f8f6f0;">
                <div class="mini-photo" style="background-color: #c5bead;"></div>
                <div class="mini-photo" style="background-color: #c5bead;"></div>
              </div>
            </div>
            <div class="frame-title">4 Frame</div>
          </div>
          <div>
            <a href=foto.html class="btn-primary" onclick="pilihFrame('Série 02: Linen Tactile', '#e8e2d5', 'count-2')">Pilih</a>
          </div>
        </div>

        <!--FRAME 6--> 
        <div class="card-frame">
          <div>
            <div class="frame-mockup" style="background-color: #d0e3da;">
              <div class="mini-photostrip">
                <div class="mini-photo" style="background-color: #a3c4b5;"></div>
                <div class="mini-photo" style="background-color: #a3c4b5;"></div>
                <div class="mini-photo" style="background-color: #a3c4b5;"></div>
              </div>
            </div>
            <div class="frame-title">6 Frame</div>
          </div>
          <div>
            <a href="foto.html" class="btn-primary" onclick="pilihFrame('Série 03: Muted Sage', '#d0e3da', 'count-3')">Pilih</a>
          </div>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
